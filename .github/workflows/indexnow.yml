name: IndexNow
# After each push to main is deployed, tell IndexNow which pages changed. The script waits for the
# live site to serve this commit (deploy is a manual wrangler step, see README) before it pings.
# No credential: IndexNow's only proof is the public key file in public/.
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: indexnow
  cancel-in-progress: true
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ping changed pages
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          changed=""
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then changed=$(git diff --name-only "$BEFORE" HEAD -- public); fi
          node scripts/indexnow-ping.mjs $changed
