name: CI
# Validation only. Deploy stays a manual vault:run step (see README); no
# Cloudflare credential lives in CI.
on:
  pull_request:
  push:
    branches: [main]
# Read-only token: this job only validates.
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-site.mjs && node --test test/*.test.mjs
